<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AQT Quiz">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.svg">
    <title>AQT Flashcard Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-top">
                <button id="backBtn" class="icon-btn hidden" aria-label="Back">&#8592;</button>
                <h1 id="appTitle">AQT Flashcard Quiz</h1>
            </div>
            <div id="topicSelector" class="topic-selector">
                <select id="topicDropdown">
                    <option value="">-- Select a Topic --</option>
                </select>
            </div>
        </header>

        <!-- Home Screen -->
        <main id="homeScreen">
            <p class="subtitle">1,025 flashcards across 17 topics</p>
            <div id="topicGrid" class="topic-grid"></div>
        </main>

        <!-- Quiz Screen -->
        <main id="quizScreen" class="hidden">
            <!-- Progress -->
            <div class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="stats-row">
                <span id="statsText">Card 1 of 26</span>
                <span id="scoreText"></span>
            </div>

            <!-- Card -->
            <div id="flashcard" class="flashcard" role="button" tabindex="0">
                <div class="card-source" id="cardSource"></div>
                <div class="card-label" id="cardLabel">Question</div>
                <div class="card-content" id="cardContent"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <div class="controls-row">
                    <button id="prevBtn" class="ctrl-btn">&#9664; Prev</button>
                    <button id="readQBtn" class="ctrl-btn accent">&#128264; Read Q</button>
                    <button id="showBtn" class="ctrl-btn primary" id="showAnswerBtn">Show Answer</button>
                    <button id="nextBtn" class="ctrl-btn">Next &#9654;</button>
                </div>
                <div class="controls-row">
                    <button id="readABtn" class="ctrl-btn accent">&#128264; Read A</button>
                    <button id="shuffleBtn" class="ctrl-btn">&#128256; Shuffle</button>
                </div>
            </div>

            <!-- Voice Controls -->
            <div class="voice-controls">
                <select id="voiceSelect" aria-label="Voice"></select>
                <div class="speed-control">
                    <label for="speedRange">Speed:</label>
                    <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1">
                    <span id="speedValue">1.0x</span>
                </div>
            </div>
        </main>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
